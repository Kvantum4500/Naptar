include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - windows/**
    - linux/**
  errors:
    # Flutter 3.50 moved Material out of the SDK into `package:material_ui` and
    # flags every `package:flutter/material.dart` import (and
    # `GlobalMaterialLocalizations`) as deprecated. The old import still works,
    # but `flutter analyze` exits with an error code even for such notes, which
    # stops the CI before its tests. Moving over is a task of its own (a new
    # dependency, ~40 files, a bridge for third-party widgets, a look at the
    # theme: audit item CMP-1); until then the note is switched off. Remove this
    # line when the move is done, so that real deprecations show again.
    deprecated_member_use: ignore

# The extra rules are of two kinds: ones that catch a real mistake (a forgotten
# await, a stream that is never cancelled, a check that always gives the same
# answer) and ones that only keep a convention the code already follows from
# slipping. A rule is added only when the code is clean under it (or needs a
# handful of mechanical fixes). The same list is in the core package.
linter:
  rules:
    # Futures and resources that are easy to forget.
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
    # Statements and checks that do nothing (usually a typo).
    - unnecessary_statements
    - no_literal_bool_comparisons
    - noop_primitive_operations
    - unnecessary_parenthesis
    - unnecessary_ignore
    # A release build can shorten class names: never build text from a type.
    - avoid_type_to_string
    - no_runtimeType_toString
    - avoid_unused_constructor_parameters
    # Conventions the code already follows.
    - always_declare_return_types
    - type_annotate_public_apis
    - prefer_single_quotes
    - prefer_final_locals
    - prefer_final_in_for_each
    - prefer_relative_imports
    - directives_ordering
    - use_string_in_part_of_directives
    - sort_pub_dependencies
    - unnecessary_library_directive
