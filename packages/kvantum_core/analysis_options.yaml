# The 'recommended' set of lints from `package:lints` (what pub.dev scores) plus
# a few rules of our own. The extra rules are of two kinds: ones that catch a
# real mistake (a forgotten await, a stream that is never cancelled, a check
# that always gives the same answer) and ones that only keep a convention the
# code already follows from slipping. A rule is added only when the code is
# clean under it (or needs a handful of mechanical fixes).
#
# For more information about the lint rules, see https://dart.dev/go/core-lints

include: package:lints/recommended.yaml

linter:
  rules:
    # Futures and resources that are easy to forget.
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
    # Statements and checks that do nothing (usually a typo).
    - unnecessary_statements
    - no_literal_bool_comparisons
    - noop_primitive_operations
    - unnecessary_parenthesis
    - unnecessary_ignore
    # A release build can shorten class names: never build text from a type.
    - avoid_type_to_string
    - no_runtimeType_toString
    - avoid_unused_constructor_parameters
    # Conventions the code already follows.
    - always_declare_return_types
    - type_annotate_public_apis
    - prefer_single_quotes
    - prefer_final_locals
    - prefer_final_in_for_each
    - prefer_relative_imports
    - directives_ordering
    - use_string_in_part_of_directives
    - sort_pub_dependencies
    - unnecessary_library_directive
