name: Build apps
# Builds the Windows zip and the Android APK and publishes them as a GitHub
# Release (tag build-<run number>), which the in-app updater downloads.
#
# Runs: on every push to main, on version tags, manually, and on feature
# branches only when the commit message contains "[build]" (saves minutes).
#
# Channels: a build of main or of a v* tag is a STABLE release (GitHub's
# "latest"). A build of any other branch (or a manual run elsewhere) is a
# PRE-RELEASE: the app offers it only when "Előzetes verziókat is keressen" is
# on. Secrets are readable by every branch workflow; to make a release wait for
# a human, move them into a GitHub Environment with required reviewers.
#
# The toolchain is pinned (Flutter 3.47.9 = Dart 3.13.7, the version the tests
# run with); move it deliberately, not by accident of the "stable" channel.
#
# Repository secrets used:
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET   Google sign-in
#   UPDATE_TOKEN                             read-only token the app uses to find updates
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD                     stable Android signing key (optional)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['main', 'claude/**']

permissions:
  contents: read

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  windows:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[build]')
    runs-on: windows-latest
    defaults: { run: { working-directory: apps/kvantum_app, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.9', channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Write local config
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          jq -n --arg i "$GOOGLE_CLIENT_ID" --arg s "$GOOGLE_CLIENT_SECRET" --arg t "$UPDATE_TOKEN" \
            '{GOOGLE_CLIENT_ID:$i,GOOGLE_CLIENT_SECRET:$s,UPDATE_TOKEN:$t}' > secrets.json
      - run: flutter build windows --release --build-number=$BUILD_NUMBER --build-name=0.2.$BUILD_NUMBER --dart-define-from-file=secrets.json
      - name: Package (zip + sha256)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/naptar-windows-$env:BUILD_NUMBER.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zip
          $h = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$h  naptar-windows-$env:BUILD_NUMBER.zip" | Out-File -Encoding ascii "$zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: naptar-windows
          path: apps/kvantum_app/dist/*
          retention-days: 14

  android:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/kvantum_app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.9', channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Signing key (only if the secrets exist)
        id: sign
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KSP" ] && [ -n "$KA" ] && [ -n "$KP" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "storeFile=$RUNNER_TEMP/upload.jks"
              echo "storePassword=$KSP"
              echo "keyAlias=$KA"
              echo "keyPassword=$KP"
            } > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Nincs Android-aláíró kulcs (ANDROID_KEYSTORE_* titkok): az APK nem frissíthető egymás fölött, ezért nem kerül a kiadásba."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Write local config
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          jq -n --arg i "$GOOGLE_CLIENT_ID" --arg s "$GOOGLE_CLIENT_SECRET" --arg t "$UPDATE_TOKEN" \
            '{GOOGLE_CLIENT_ID:$i,GOOGLE_CLIENT_SECRET:$s,UPDATE_TOKEN:$t}' > secrets.json
      - run: flutter build apk --release --build-number=$BUILD_NUMBER --build-name=0.2.$BUILD_NUMBER --dart-define-from-file=secrets.json
      - name: Package (apk + sha256)
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/naptar-android-$BUILD_NUMBER.apk"
          (cd dist && sha256sum "naptar-android-$BUILD_NUMBER.apk" > "naptar-android-$BUILD_NUMBER.apk.sha256")
          echo "${{ steps.sign.outputs.signed }}" > dist/SIGNED
      - uses: actions/upload-artifact@v4
        with:
          name: naptar-android
          path: apps/kvantum_app/dist/*
          retention-days: 14

  release:
    needs: [windows, android]
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: naptar-windows, path: out }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: naptar-android, path: out }
      - name: Decide which files go public
        id: files
        run: |
          ls -la out
          # The APK is only released when it was signed with the stable key.
          if [ -f out/SIGNED ] && [ "$(cat out/SIGNED)" = "true" ]; then
            echo "apk=out/naptar-android-${BUILD_NUMBER}.apk" >> "$GITHUB_OUTPUT"
            echo "apksha=out/naptar-android-${BUILD_NUMBER}.apk.sha256" >> "$GITHUB_OUTPUT"
          fi
      - name: Stable or preview?
        id: channel
        run: |
          # GITHUB_REF / GITHUB_REF_NAME come from the environment, never pasted into the script
          if [ "$GITHUB_REF" = "refs/heads/main" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "title=" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "title= (előzetes: $GITHUB_REF_NAME)" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }}${{ steps.channel.outputs.title }}
          body: |
            Build ${{ github.run_number }} (${{ github.sha }})
            ${{ github.event.head_commit.message }}
          prerelease: ${{ steps.channel.outputs.stable != 'true' }}
          make_latest: ${{ steps.channel.outputs.stable == 'true' }}
          files: |
            out/naptar-windows-${{ github.run_number }}.zip
            out/naptar-windows-${{ github.run_number }}.zip.sha256
            ${{ steps.files.outputs.apk }}
            ${{ steps.files.outputs.apksha }}
