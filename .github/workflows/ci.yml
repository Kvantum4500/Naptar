name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
# a newer push to the same ref makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/kvantum_core } }
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: '3.13.7' }  # the Dart of Flutter 3.47.9
      - run: dart pub get
      - run: dart analyze
      - run: dart test
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/kvantum_app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.9', channel: stable, cache: true }
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
