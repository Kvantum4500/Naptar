name: Android keystore (egyszeri)
# Egyszer futtatandó: létrehoz egy Android-aláíró kulcsot, és egy napig letölthető
# artifactként adja a négy titok értékét. A kulcsot ŐRIZD MEG (titokként a
# repóban): elvesztése után a telepített appot újra kell telepíteni.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore naptar.jks -alias naptar -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Naptar, O=Kvantum"
          {
            echo "ANDROID_KEYSTORE_B64=$(base64 -w0 naptar.jks)"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_ALIAS=naptar"
            echo "ANDROID_KEY_PASSWORD=$PASS"
          } > keystore-secrets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-keystore-SECRETS
          path: keystore-secrets.txt
          retention-days: 1
